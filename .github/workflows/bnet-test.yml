name: Battle.net test build

# Builds an installable test APK of the Battle.net branch on every push and publishes it as a
# pre-release, so it can be downloaded on the phone. The package id ends in .bnettest, so it
# installs next to the regular app.
on:
  push:
    branches:
      - feat/battle-net
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bnet-test
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install the NDK
        run: |
          NDK=$(sed -n 's/.*ndkVersion = "\(.*\)".*/\1/p' app/build.gradle.kts)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK" > /dev/null

      - name: Fetch runtime components
        run: tools/fetch_components.sh

      - name: Configure the SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Unit tests
        run: ./gradlew --no-daemon testModernDebugUnitTest

      - name: Build
        run: ./gradlew --no-daemon assembleModernDebug

      - name: Prepare the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/modern/debug/app-modern-debug.apk dist/WoW-Foreverywhere-bnettest.apk
          (cd dist && sha256sum WoW-Foreverywhere-bnettest.apk > WoW-Foreverywhere-bnettest.apk.sha256)

      - name: Publish the test build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bnet-test-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Battle.net test build ${{ github.run_number }}
          body: |
            Test build of the Battle.net branch (commit ${{ github.sha }}).
            Installs next to the regular app (package id ends in .bnettest).
          prerelease: true
          make_latest: false
          files: |
            dist/WoW-Foreverywhere-bnettest.apk
            dist/WoW-Foreverywhere-bnettest.apk.sha256

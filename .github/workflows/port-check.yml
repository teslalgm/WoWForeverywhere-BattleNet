name: Port check (upstream main + Battle.net)

# Compiles the Battle.net port onto upstream main and runs its unit tests.
# Publishes nothing; the APK is kept as a workflow artifact.
on:
  push:
    branches:
      - yoru-battle-net-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install the NDK
        run: |
          NDK=$(sed -n 's/.*ndkVersion = "\(.*\)".*/\1/p' app/build.gradle.kts)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK" > /dev/null

      - name: Fetch runtime components
        run: tools/fetch_components.sh

      - name: Configure the SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Rebuild the FUSE shim and compare with the committed one
        run: |
          NDK=$(sed -n 's/.*ndkVersion = "\(.*\)".*/\1/p' app/build.gradle.kts)
          CC="$ANDROID_HOME/ndk/$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang"
          "$CC" -shared -fPIC -O2 -Wall -Werror -Wl,-z,max-page-size=16384 -s \
            -o /tmp/libgamenative_fuse_chmod.so app/src/main/cpp/gamenative_fuse_chmod.c -ldl
          sha256sum /tmp/libgamenative_fuse_chmod.so app/src/main/jniLibs/arm64-v8a/libgamenative_fuse_chmod.so
          cmp /tmp/libgamenative_fuse_chmod.so app/src/main/jniLibs/arm64-v8a/libgamenative_fuse_chmod.so && echo "identical" || echo "::warning::rebuilt shim differs from the committed binary"

      - name: Unit tests
        run: ./gradlew --no-daemon testModernDebugUnitTest

      - name: Build
        run: ./gradlew --no-daemon assembleModernDebug

      - uses: actions/upload-artifact@v4
        with:
          name: foreverywhere-battlenet-port
          path: app/build/outputs/apk/modern/debug/*.apk
          retention-days: 7
